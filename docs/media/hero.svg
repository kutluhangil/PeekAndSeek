 fill="#fff" style="animation:tw 3.3s ease-in-out 0s infinite"/><circle cx="796.3" cy="265.5" r="1.4" fill="#fff" style="animation:tw 2.5s ease-in-out 1.4s infinite"/><circle cx="758.4" cy="323" r="0.7" fill="#fff" style="animation:tw 3.4s ease-in-out 2s infinite"/><circle cx="815.5" cy="215.8" r="1" fill="#fff" style="animation:tw 2.5s ease-in-out 0.1s infinite"/><circle cx="1048.3" cy="115.2" r="1.2" fill="#fff" style="animation:tw 2.6s ease-in-out 1.9s infinite"/><circle cx="1083.4" cy="292.7" r="0.8" fill="#fff" style="animation:tw 2.3s ease-in-out 2s infinite"/><circle cx="1119.9" cy="109.7" r="1.1" fill="#fff" style="animation:tw 2.5s ease-in-out 1.8s infinite"/></g>
